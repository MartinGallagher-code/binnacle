[build-system]
# 64, not 77.  The PEP 639 `license = "<SPDX>"` string form needs
# setuptools>=77, and setuptools 77 needs Python>=3.9 -- which would make a
# package that advertises requires-python >=3.6 impossible to build from its
# own sdist on the Pythons it claims.  See the `license` field below.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "binnacle"
version = "0.4.0"
description = "Instruments for Linux boxes, fleets and the networks between: diagnose, don't dump"
readme = "README.md"
requires-python = ">=3.6"
# The classic table rather than PEP 639's SPDX string, deliberately.  The
# string form raises the metadata to version 2.4 and the build floor to
# setuptools>=77 (Python>=3.9), and an old pip that cannot read 2.4 metadata
# falls back to the sdist, which then cannot be built on the very Pythons
# this package supports.  The classic form keeps `pip install binnacle`
# working down to the 3.6 floor.  LICENSE still ships: setuptools includes
# LICEN[CS]E* by default.
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Martin J. Gallagher" }]
maintainers = [{ name = "Martin J. Gallagher" }]
keywords = [
    "sysadmin",
    "work-queue",
    "lease",
    "diagnostics",
    "troubleshooting",
    "performance",
    "benchmark",
    "bottleneck",
    "profiling",
    "network",
    "latency",
    "path-mtu",
    "fleet",
    "dns",
    "resolver",
    "ssh",
    "log-analysis",
    "linux",
    "observability",
    "sre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]

# Standard library only, here and on every host these are copied to. That
# is a hard constraint rather than a preference: `netmesh` scp's itself to
# each machine in the mesh and `agree script` pushes a tool to a fleet, so
# anything these needed would have to be installed everywhere first.
dependencies = []

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/binnacle"
Documentation = "https://binnacle.readthedocs.io"
Repository = "https://github.com/MartinGallagher-code/binnacle"
Changelog = "https://github.com/MartinGallagher-code/binnacle/blob/main/CHANGELOG.md"
Issues = "https://github.com/MartinGallagher-code/binnacle/issues"

# The command names, not the module names, are the interface. why-slow is
# hyphenated because that is how it reads in a sentence; the module under
# it has to be why_slow because Python says so.
[project.scripts]
# The index first: `binnacle` is the housing rather than a ninth
# instrument -- it lists what is installed and prints every tool's help,
# so a new user has one name to remember instead of eight.
binnacle = "binnacle.binnacle:main"
why-slow = "binnacle.why_slow:main"
agree = "binnacle.agree:main"
logtriage = "binnacle.logtriage:main"
netmesh = "binnacle.netmesh:main"
reachable = "binnacle.reachable:main"
resolve = "binnacle.resolve:main"
during = "binnacle.during:main"
skew = "binnacle.skew:main"
muster = "binnacle.muster:main"

[tool.setuptools]
packages = ["binnacle"]
