[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binnacle"
version = "0.2.1"
description = "Instruments for Linux boxes, fleets and the networks between: diagnose, don't dump"
readme = "README.md"
requires-python = ">=3.6"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Martin J. Gallagher" }]
maintainers = [{ name = "Martin J. Gallagher" }]
keywords = [
    "sysadmin",
    "diagnostics",
    "troubleshooting",
    "performance",
    "benchmark",
    "bottleneck",
    "profiling",
    "network",
    "latency",
    "path-mtu",
    "fleet",
    "dns",
    "resolver",
    "ssh",
    "log-analysis",
    "linux",
    "observability",
    "sre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]

# Standard library only, here and on every host these are copied to. That
# is a hard constraint rather than a preference: `netmesh` scp's itself to
# each machine in the mesh and `agree script` pushes a tool to a fleet, so
# anything these needed would have to be installed everywhere first.
dependencies = []

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/binnacle"
Documentation = "https://binnacle.readthedocs.io"
Repository = "https://github.com/MartinGallagher-code/binnacle"
Changelog = "https://github.com/MartinGallagher-code/binnacle/blob/main/CHANGELOG.md"
Issues = "https://github.com/MartinGallagher-code/binnacle/issues"

# The command names, not the module names, are the interface. why-slow is
# hyphenated because that is how it reads in a sentence; the module under
# it has to be why_slow because Python says so.
[project.scripts]
why-slow = "binnacle.why_slow:main"
agree = "binnacle.agree:main"
logtriage = "binnacle.logtriage:main"
netmesh = "binnacle.netmesh:main"
reachable = "binnacle.reachable:main"
resolve = "binnacle.resolve:main"
during = "binnacle.during:main"

[tool.setuptools]
packages = ["binnacle"]
