#
# Read the Docs configuration (v2). After importing the repo on
# readthedocs.org no further setup is needed: this file says how to build,
# and the docs job in ci.yml keeps the build green before it ever reaches
# RTD.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # The CLI reference is generated from the live parsers during the build,
  # so a warning there is a real defect. CI runs the same build with -W.
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
