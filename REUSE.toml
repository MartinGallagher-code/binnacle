# REUSE compliance (https://reuse.software, spec 3.3).
#
# The Python modules carry their own SPDX headers; this file covers
# everything else -- tests, docs, workflows and metadata -- in bulk.
# `precedence = "closest"` means any file with its own header keeps it.
version = 1
SPDX-PackageName = "binnacle"
SPDX-PackageSupplier = "Martin J. Gallagher <martinjgallagher@icloud.com>"
SPDX-PackageDownloadLocation = "https://github.com/MartinGallagher-code/binnacle"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Martin J. Gallagher"
SPDX-License-Identifier = "GPL-3.0-or-later"
