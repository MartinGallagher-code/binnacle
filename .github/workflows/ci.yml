name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the hosted runners still provide. The declared floor
        # is 3.6, which setup-python can no longer install, so the bottom of
        # the range runs in a container in the python-floor job below.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    name: test (python ${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # The suite needs nothing installed: ssh and scp are faked with a
      # shim, and the only real packets are netmesh's own agents on
      # loopback, which need a couple of free UDP ports and nothing else.
      - name: Run the test suite
        run: bash tests/run_tests.sh

  python-floor:
    name: Python 3.6 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches stdlib APIs newer than the floor, which a syntax-only
      # compile check cannot see. netmesh copies itself to every host in the
      # mesh and agree pushes a tool to a fleet, so the floor is what those
      # machines actually have -- a RHEL 8 box ships 3.6.
      - name: Scan for post-3.6 syntax and stdlib APIs
        run: |
          python -m pip install --upgrade vermin
          bash tests/check_python_compat.sh
          # The '-' suffix means "3.6 or later"; a bare --target=3.6 asks for
          # code that needs *exactly* 3.6 and fails on anything older.
          vermin --eval-annotations --violations --target=3.6- binnacle/*.py

      # Hosted runners no longer offer a 3.6 toolchain, so use the
      # container. Checkout runs on the host, so there is no node20 issue.
      - name: Run the suite under real Python 3.6
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.6-slim \
            bash -euxc 'bash tests/check_python_compat.sh && bash tests/run_tests.sh'

  docs:
    name: docs build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same invocation Read the Docs runs, with warnings as errors, so
      # a docs break fails the PR instead of surfacing on RTD later. The CLI
      # reference is generated from the live parsers during this build, so a
      # new flag that would render badly also fails here.
      - name: Build the docs
        run: |
          python -m pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # SC1091 only says shellcheck cannot open the sourced helper from its
      # own working directory; following it instead (-x) makes every test
      # function look unreachable, because run_test calls them by name.
      # Excluding the one info-level check is the honest trade.
      - name: Run shellcheck over the test harness
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 tests/*.sh tests/test_helper.bash

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check licensing headers
        run: |
          python -m pip install --upgrade reuse
          reuse lint

  build:
    name: build the wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # A pip install must put all nine working commands on PATH -- that is
      # the documented install path, and metadata alone does not prove it.
      # Three of them (resolve, during, skew) used to ship unexercised.
      - name: Install the wheel and smoke-test every entry point
        run: |
          python -m pip install dist/*.whl
          for cmd in binnacle why-slow agree logtriage netmesh reachable resolve during skew; do
            "$cmd" --version
          done
          # binnacle is the one that checks the other eight agree on a
          # version, and exits 1 if they do not.
          binnacle
          # Drive each one far enough to prove it actually runs.
          why-slow --interval 0 --quiet
          logtriage --mask 'Jan  7 12:34:56 h sshd[1]: fail from 10.0.0.1'
          agree hosts -H 'node[01-03]'
          netmesh selftest --for 3
          printf 'localhost\n' > hosts.txt
          reachable hosts.txt --dry-run
